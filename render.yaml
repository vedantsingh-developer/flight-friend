services:
  - type: web
    name: flight-friend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: flight-friend-8eb51
      - key: FIREBASE_API_KEY
        value: AIzaSyCN9WvvavsmLDUFUMBctAJ20xttnQK7yrE
      - key: ADMIN_USERNAME
        value: Vedant
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SALT
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: LOOKUP_HMAC_KEY
        generateValue: true
